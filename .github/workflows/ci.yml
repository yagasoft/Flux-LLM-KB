name: native-ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  native-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore packages
        run: dotnet restore FluxKnowledge.slnx --locked-mode
      - name: Build
        run: dotnet build FluxKnowledge.slnx -c Release --no-restore -warnaserror
      - name: Test native contracts
        run: dotnet test FluxKnowledge.slnx -c Release --no-build --filter "Category!=Browser" --logger "console;verbosity=minimal"
      - name: Verify native closeout plan
        shell: pwsh
        run: ./tests/native/complete-feature-dryrun.ps1
      - name: Verify native deployment plan
        shell: pwsh
        run: ./tests/native/native-deployment-plan.ps1
