name: native-ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  native-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore packages
        run: dotnet restore FluxKnowledge.slnx --locked-mode
      - name: Build
        run: dotnet build FluxKnowledge.slnx -c Release --no-restore -warnaserror
      - name: Test native contracts
        run: dotnet test FluxKnowledge.slnx -m:1 -c Release --no-build --filter "Category!=Browser" --logger "console;verbosity=minimal"
      - name: Verify repository and documentation
        shell: pwsh
        run: ./tests/native/repository-contract.ps1
      - name: Verify native closeout plan
        shell: pwsh
        run: ./tests/native/complete-feature-dryrun.ps1
      - name: Verify isolated closeout and deployment contracts
        shell: pwsh
        run: ./tests/native/complete-feature-isolated-contracts.ps1
      - name: Verify paired contract failure and cancellation
        shell: pwsh
        run: ./tests/native/complete-feature-isolated-contracts-proof.ps1
      - name: Verify scenario process isolation
        shell: pwsh
        run: ./tests/native/complete-feature-parallel-contract.ps1
      - name: Verify test timing summary
        shell: pwsh
        run: ./tests/native/test-timing-summary-contract.ps1
      - name: Verify solution test fail-fast behaviour
        shell: pwsh
        run: ./tests/native/solution-test-failfast-contract.ps1
